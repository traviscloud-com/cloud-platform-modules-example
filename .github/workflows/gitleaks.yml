# Secret scanning on every push/PR plus a weekly full-history sweep.
# Runs the gitleaks CLI directly (no licence or token needed).
# Reads .gitleaks.toml from the repo root, the same config the git hooks use.
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0   # scan full history, not just the checkout
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          # sha256 of the linux_x64 tarball, from the release's checksums file
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full history
        run: '"${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --config .gitleaks.toml'
